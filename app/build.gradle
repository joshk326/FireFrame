plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fireframe.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fireframe.home'
        minSdk 22
        targetSdk 34
        versionCode 6
        versionName '1.1.3'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
